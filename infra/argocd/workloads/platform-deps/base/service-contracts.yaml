apiVersion: v1
kind: Service
metadata:
  name: juliaflow-postgres
  namespace: juliaflow
  annotations:
    juliaflow.dev/provider-contract: "postgres"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: juliaflow-redis
  namespace: juliaflow
  annotations:
    juliaflow.dev/provider-contract: "redis"
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: juliaflow-kafka
  namespace: juliaflow
  annotations:
    juliaflow.dev/provider-contract: "kafka"
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: juliaflow-object-store
  namespace: juliaflow
  annotations:
    juliaflow.dev/provider-contract: "object-storage"
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: juliaflow-keycloak
  namespace: juliaflow
  annotations:
    juliaflow.dev/provider-contract: "oidc"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
