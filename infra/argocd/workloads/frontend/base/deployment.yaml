apiVersion: apps/v1
kind: Deployment
metadata:
  name: juliaflow-frontend
  namespace: juliaflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: juliaflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: juliaflow
    spec:
      containers:
        - name: frontend
          image: ghcr.io/juliaflow/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: frontend-runtime-config
              mountPath: /usr/share/nginx/html/juliaflow-config.js
              subPath: juliaflow-config.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: frontend-runtime-config
          configMap:
            name: juliaflow-frontend-config
            items:
              - key: juliaflow-config.js
                path: juliaflow-config.js
