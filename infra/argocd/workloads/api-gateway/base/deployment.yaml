apiVersion: apps/v1
kind: Deployment
metadata:
  name: juliaflow-api-gateway
  namespace: juliaflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: juliaflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: juliaflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8088"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/juliaflow/api-gateway:dev
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=.
            - scripts/run-api-gateway.jl
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: juliaflow-api-gateway-config
            - secretRef:
                name: juliaflow-api-gateway-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
