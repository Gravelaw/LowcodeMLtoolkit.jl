apiVersion: v1
kind: Service
metadata:
  name: juliaflow-api-gateway
  namespace: juliaflow
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8088"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: juliaflow
  ports:
    - name: http
      port: 8088
      targetPort: http
