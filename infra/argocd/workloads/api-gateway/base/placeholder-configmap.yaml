apiVersion: v1
kind: ConfigMap
metadata:
  name: juliaflow-api-gateway-intent
  namespace: juliaflow
data:
  servicePath: "services/api-gateway/"
  contractInputs: "packages/contracts/openapi/openapi.json; packages/contracts/protocol/jsonrpc.json"
  runtimeDependencies: "postgres, redis, keycloak"
  rolloutGoal: "replace with Deployment, Service, Ingress, Secret refs before cp/02-alpha-core"
  healthContract: "healthcheck() returns api-gateway ok payload"
