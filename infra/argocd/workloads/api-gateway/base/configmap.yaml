apiVersion: v1
kind: ConfigMap
metadata:
  name: juliaflow-api-gateway-config
  namespace: juliaflow
data:
  JULIAFLOW_GATEWAY_HOST: "0.0.0.0"
  JULIAFLOW_GATEWAY_PORT: "8088"
  JULIAFLOW_GATEWAY_BACKEND: "file"
  JULIAFLOW_DATABASE_SCHEMA: "public"
  JULIAFLOW_EVENT_BACKBONE_MODE: "consume"
  JULIAFLOW_STREAM_WORKER_MODE: "process"
  JULIAFLOW_GPU_WORKER_MODE: "process"
  JULIAFLOW_AUTH_MODE: "required"
  JULIAFLOW_OIDC_DISCOVERY_URL: "http://juliaflow-keycloak:8080/realms/juliaflow/.well-known/openid-configuration"
  JULIAFLOW_STORE_ROOT: "/var/lib/juliaflow/gateway-store"
  JULIAFLOW_WORKFLOW_PATH: "/app/tests/contracts/fixtures/foundation.workflow.toml"
