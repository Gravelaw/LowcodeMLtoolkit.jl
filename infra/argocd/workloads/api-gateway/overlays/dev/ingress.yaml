apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juliaflow-api-gateway
  namespace: juliaflow
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.dev.juliaflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: juliaflow-api-gateway
                port:
                  name: http
