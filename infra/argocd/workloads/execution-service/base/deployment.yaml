apiVersion: apps/v1
kind: Deployment
metadata:
  name: juliaflow-execution-service
  namespace: juliaflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
      app.kubernetes.io/part-of: juliaflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/part-of: juliaflow
    spec:
      containers:
        - name: execution-service
          image: ghcr.io/juliaflow/execution-service:dev
          imagePullPolicy: IfNotPresent
          command:
            - julia
            - --project=.
            - scripts/run-execution-service.jl
          ports:
            - name: rpc
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: juliaflow-execution-service-config
            - secretRef:
                name: juliaflow-execution-service-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
