services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: juliaflow
      POSTGRES_USER: juliaflow
      POSTGRES_PASSWORD: juliaflow
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: juliaflow
      MINIO_ROOT_PASSWORD: juliaflowminio
    ports:
      - "9000:9000"
      - "9001:9001"
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
  gpu-worker:
    image: julia:1.12
    profiles:
      - gpu
    command:
      - bash
      - -lc
      - |
        julia --project=. scripts/run-gpu-worker.jl
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      JULIAFLOW_WORKER_LANE: gpu
      JULIAFLOW_WORKER_POOL: alpha-gpu
      JULIAFLOW_ACCELERATOR: cuda
      JULIAFLOW_GATEWAY_BACKEND: file
      JULIAFLOW_STORE_ROOT: /workspace/tmp/gateway-store
      JULIAFLOW_GPU_WORKER_POLL_MS: 1000
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
  stream-worker:
    image: julia:1.12
    command:
      - bash
      - -lc
      - |
        julia --project=. scripts/run-stream-worker.jl
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      JULIAFLOW_GATEWAY_BACKEND: file
      JULIAFLOW_STORE_ROOT: /workspace/tmp/gateway-store
      JULIAFLOW_STREAM_WORKER_POLL_MS: 1000
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
