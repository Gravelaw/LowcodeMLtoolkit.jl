name: release-candidate-evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc.*"

jobs:
  execution-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Select hosted or local execution
        id: policy
        run: node scripts/ci/hosted-policy.mjs

  debian-release-gate:
    needs: execution-policy
    if: needs.execution-policy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Tag creation has no previous commit; compare RC changes to the default branch.
      JULIAFLOW_CONTROL_DOC_BASE: origin/${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debian-release-verification
          path: artifacts/release-verification/latest
          if-no-files-found: error
