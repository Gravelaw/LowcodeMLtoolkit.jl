name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm install
      - run: npm run build
      - run: npm run test

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. tests/julia/runtests.jl

